name: Protect master branch

on:
  pull_request:
    branches: [master]

jobs:
  check-base-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow PRs from develop
        if: github.head_ref != 'develop'
        run: |
          echo "::error::PRs to master must come from the develop branch. Please target develop instead."
          exit 1
